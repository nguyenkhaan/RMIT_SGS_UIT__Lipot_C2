services:
  tidecloak-storage-init:
    image: tideorg/tidecloak-dev:latest
    user: "0:0"
    entrypoint: ["chown"]
    command: ["-R", "1000:1000", "/opt/keycloak/data/h2"]
    volumes:
      - rental-passport-tidecloak-data:/opt/keycloak/data/h2

  tidecloak:
    image: tideorg/tidecloak-dev:latest
    container_name: rental-passport-tidecloak
    depends_on:
      tidecloak-storage-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${TIDECLOAK_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${TIDECLOAK_BOOTSTRAP_ADMIN_PASSWORD:?Set TIDECLOAK_BOOTSTRAP_ADMIN_PASSWORD before starting TideCloak.}
    volumes:
      - rental-passport-tidecloak-data:/opt/keycloak/data/h2

volumes:
  rental-passport-tidecloak-data:
    name: rental-passport-tidecloak-data
